<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Matrix Mono Glyph Map</title>
<style>
  @font-face {
    font-family: 'Matrix Mono';
    src: url('/fonts/Matrix-Mono.woff2') format('woff2');
  }
  body {
    background: #0A0A0A;
    color: #E8E8E8;
    font-family: monospace;
    padding: 2rem;
  }
  h1 { color: #C2FE0C; font-size: 1.5rem; margin-bottom: 1rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
  }
  .cell {
    background: #1A1A1A;
    border: 1px solid #333;
    padding: 12px 8px;
    text-align: center;
  }
  .glyph {
    font-family: 'Matrix Mono', monospace;
    font-size: 2rem;
    color: #C2FE0C;
    display: block;
    min-height: 2.5rem;
    line-height: 2.5rem;
  }
  .code {
    font-size: 0.7rem;
    color: #666;
    margin-top: 4px;
  }
  .empty .glyph { color: #333; }
</style>
</head>
<body>
<h1>MATRIX MONO — PUA GLYPH MAP</h1>
<p style="color:#666;font-size:0.8rem;margin-bottom:1rem;">Characters \uE000–\uE0FF. Green = renders a visible glyph. Dark = empty/missing.</p>
<div class="grid" id="grid"></div>
<script>
const grid = document.getElementById('grid');
for (let i = 0xE000; i <= 0xE0FF; i++) {
  const char = String.fromCodePoint(i);
  const hex = i.toString(16).toUpperCase().padStart(4, '0');
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = `<span class="glyph">${char}</span><span class="code">\\u${hex}</span>`;
  grid.appendChild(cell);
}
// After render, check which glyphs are actually visible
// by measuring each .glyph span width (invisible chars have 0 or default width)
setTimeout(() => {
  document.querySelectorAll('.cell').forEach(cell => {
    const glyph = cell.querySelector('.glyph');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = '32px "Matrix Mono"';
    const metrics = ctx.measureText(glyph.textContent);
    if (metrics.width < 2) {
      cell.classList.add('empty');
    }
  });
}, 1000);
</script>
</body>
</html>
