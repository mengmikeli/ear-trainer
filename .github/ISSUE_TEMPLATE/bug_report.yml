name: Bug Report
description: Report a bug in the Ear Trainer app
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: page
    attributes:
      label: Page
      options:
        - Home
        - Quiz - Intervals
        - Quiz - Chords
        - Quiz - Scales
        - Quiz - Modes
        - Lab - Intervals
        - Lab - Chords
        - Lab - Scales
        - Progress
        - Settings
        - Navigation
        - Audio (global)
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Go to ...
        3. Tap ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / Browser
      placeholder: "iPhone 15 Safari / Chrome desktop 1440px / etc."
  - type: input
    id: version
    attributes:
      label: App version (from Settings)
      placeholder: "v3.5.0+abc1234"
