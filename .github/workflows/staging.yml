name: Deploy Staging to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: '/ear-trainer'

      # Preserve PR preview directories during staging deploy
      - name: Fetch existing PR previews
        run: |
          git fetch origin gh-pages --depth=1 || true
          if git show origin/gh-pages:pr 2>/dev/null; then
            git checkout origin/gh-pages -- pr/
            cp -r pr build/pr
          fi

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
