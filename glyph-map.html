<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Matrix Mono Glyph Map</title>
<style>
@font-face { font-family: 'Matrix Mono'; src: url('/fonts/Matrix-Mono.woff2') format('woff2'); }
body { background: #0A0A0A; color: #E8E8E8; font-family: monospace; padding: 1rem; }
h1 { color: #C2FE0C; font-size: 1.2rem; margin-bottom: 0.5rem; }
p { color: #666; font-size: 0.8rem; margin-bottom: 1rem; }
.grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; }
.c { background: #1A1A1A; border: 1px solid #333; padding: 8px 4px; text-align: center; cursor: pointer; }
.c:hover { border-color: #C2FE0C; }
.g { font-family: 'Matrix Mono'; font-size: 1.5rem; color: #C2FE0C; display: block; min-height: 2rem; line-height: 2rem; }
.n { font-size: 0.5rem; color: #666; }
.selected { border-color: #C2FE0C; background: #1a2a0a; }
#picked { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 1px solid #333; padding: 0.5rem 1rem; font-size: 0.8rem; color: #C2FE0C; }
</style>
</head>
<body>
<h1>MATRIX MONO PUA GLYPHS</h1>
<p>Click a glyph to copy its code. Range: U+E000-U+E0FF</p>
<div class="grid" id="g"></div>
<div id="picked">Click a glyph to select</div>
<script>
const g = document.getElementById('g');
const picked = document.getElementById('picked');
for (let i = 0xE000; i <= 0xE0FF; i++) {
  const c = document.createElement('div');
  c.className = 'c';
  const hex = i.toString(16).toUpperCase().padStart(4, '0');
  c.innerHTML = `<span class="g">${String.fromCodePoint(i)}</span><span class="n">${hex}</span>`;
  c.onclick = () => {
    document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
    c.classList.add('selected');
    picked.textContent = `Selected: \\u${hex} — ${String.fromCodePoint(i)}`;
    navigator.clipboard?.writeText(`\\u${hex}`);
  };
  g.appendChild(c);
}
</script>
</body>
</html>
